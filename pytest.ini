[pytest]
testpaths = automation/tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=reports/allure-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=reports/test-artifacts

markers =
    smoke: minimal build-acceptance suite — must stay fast and always green
    regression: full functional regression suite
    e2e: end-to-end user journey through the UI
    ui: browser-driven UI test (lives under automation/tests/ui/)
    api: API-level test, no browser required
    p1: critical path — blocks release on failure
    p2: important but not release-blocking
    p3: low priority / nice to have
    negative: invalid input and error-handling paths
    boundary: boundary value and edge-condition coverage
    a11y: accessibility check
    slow: takes over 30s — excluded from the fast feedback loop
    manual: documented here but executed by a human, never collected in CI

# Fail the run if a test takes an unreasonable time to finish
timeout = 300

log_cli = false
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %H:%M:%S
